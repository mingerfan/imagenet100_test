# FHE统计批量分析配置文件
# 用于批量分析多个网络的FHE统计特性

# 全局设置
global:
    # 输出目录
    output_folder: "fhe_statistics/results"
    plot_folder: "fhe_statistics/plots"

    # 默认输入形状 [batch, channels, height, width]
    default_input_shape: [1, 3, 224, 224]

    # 是否打印详细统计
    print_detailed: true

    # 是否生成图表
    generate_plots: true

    # 是否生成综合比较图
    generate_comparison: true

# 模型分析列表
# 支持三种模型来源：
# 1. torchvision预训练模型
# 2. 自定义模型（从gate_net.py等加载）
# 3. 从checkpoint加载的模型

models:
    # ==================== TorchVision 预训练模型 ====================
    - name: "ResNet18"
      source: "torchvision"
      model_class: "resnet18"
      input_shape: [1, 3, 224, 224]
      description: "ResNet-18 (ImageNet预训练)"
      enabled: true

    - name: "ResNet34"
      source: "torchvision"
      model_class: "resnet34"
      input_shape: [1, 3, 224, 224]
      description: "ResNet-34 (ImageNet预训练)"
      enabled: true

    - name: "ResNet50"
      source: "torchvision"
      model_class: "resnet50"
      input_shape: [1, 3, 224, 224]
      description: "ResNet-50 (ImageNet预训练)"
      enabled: true

    - name: "VGG16"
      source: "torchvision"
      model_class: "vgg16"
      input_shape: [1, 3, 224, 224]
      description: "VGG-16 (ImageNet预训练)"
      enabled: true

    - name: "MobileNetV2"
      source: "torchvision"
      model_class: "mobilenet_v2"
      input_shape: [1, 3, 224, 224]
      description: "MobileNet V2 (ImageNet预训练)"
      enabled: true

    - name: "EfficientNet_B0"
      source: "torchvision"
      model_class: "efficientnet_b0"
      input_shape: [1, 3, 224, 224]
      description: "EfficientNet-B0 (ImageNet预训练)"
      enabled: true
      optional: true  # 如果加载失败，不中断整个流程

    # ==================== 自定义模型（从gate_net.py加载） ====================
    - name: "ResNet18-SelfGated-Swish"
      source: "custom"
      module_path: "models.gate_net"
      model_class: "resnet18"
      params:
          block_type: "self_gated"
          activation_type: "swish"
          num_classes: 100
          pretrained: false
      input_shape: [1, 3, 224, 224]
      description: "ResNet-18 with Self-Gated + Swish"
      enabled: false

    - name: "ResNet18-Basic-LearnableSwish"
      source: "custom"
      module_path: "models.gate_net"
      model_class: "resnet18"
      params:
          block_type: "basic"
          activation_type: "learnable_swish"
          num_classes: 100
          pretrained: false
      input_shape: [1, 3, 224, 224]
      description: "ResNet-18 with Basic + LearnableSwish"
      enabled: false

    # ==================== 从checkpoint加载的模型 ====================
    - name: "ResNet18-Trained-ImageNet100"
      source: "checkpoint"
      module_path: "models.gate_net"
      model_class: "resnet18"
      checkpoint_path: "checkpoints/resnet18_imagenet100_best.pth"
      params:
          block_type: "basic"
          activation_type: "relu"
          num_classes: 100
          pretrained: false
      input_shape: [1, 3, 224, 224]
      description: "ResNet-18 trained on ImageNet-100"
      enabled: false

    # ==================== 不同分辨率的测试 ====================
    - name: "ResNet18-96x96"
      source: "torchvision"
      model_class: "resnet18"
      input_shape: [1, 3, 96, 96]
      description: "ResNet-18 at 96x96 resolution"
      enabled: false

    - name: "ResNet18-128x128"
      source: "torchvision"
      model_class: "resnet18"
      input_shape: [1, 3, 128, 128]
      description: "ResNet-18 at 128x128 resolution"
      enabled: false

    - name: "MobileNetV2-96x96"
      source: "torchvision"
      model_class: "mobilenet_v2"
      input_shape: [1, 3, 96, 96]
      description: "MobileNet V2 at 96x96 resolution"
      enabled: false

# 批量分析模式（可选）
# 使用正则表达式批量启用符合条件的模型
batch_patterns:
    # 示例：启用所有ResNet变体
    # - pattern: "^ResNet.*"
    #   enabled: true

    # 示例：启用所有224x224分辨率的模型
    # - pattern: ".*224.*"
    #   enabled: true

# 比较分析设置
comparison:
    # 要生成的比较图类型
    plot_types:
        - "network_comparison"           # 网络横向比较（算子堆叠）
        - "comprehensive_comparison"     # 综合比较（6个子图）
        - "grouped_comparison"           # 分组比较（归一化）

    # 浅层分析阈值（相对于最大深度的比例）
    shallow_threshold: 0.2

    # 深度分箱设置
    depth_bin_size: 10
    max_depth_bins: 30

# FHE参数设置（可选，覆盖默认值）
fhe_params:
    rotation_cost: 180
    rescale_cost: 40
    mul_single_cost: 9.5
    mul_double_cost: 253
    boot_cost: 98136
    level: 10
    slots_num: 32768
