name: "efficientnet_style"
description: "EfficientNet B0 style - no second downsample layer, like the original EfficientNet"

dataset:
  name: "imagenet"
  num_classes: 100
  input_size: 224

search_space:
  ct_slots: 32768
  initial_ct_count: 1

  stem:
    enabled: true
    allowed_codes: null  # 允许所有stem配置

  second_downsample:
    enabled: true
    allowed_codes: [5]  # 只允许"不使用"选项（EfficientNet B0风格）

  blocks:
    allowed_block_ids: null  # 允许所有block
    first_layers_constraints: null

  stride:
    allowed_block_counts: null
    num_strides: 3

  ct_policies:
    allowed: ["keep", "half"]

output:
  base_dir: "generated_networks/efficientnet_style"
  save_format: "json"
