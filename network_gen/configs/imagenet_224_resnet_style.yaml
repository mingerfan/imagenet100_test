# ImageNet-100配置文件 (224x224输入) - ResNet风格
# 只使用BasicBlock及其门控变体，排除所有MBConv

name: "imagenet_224_resnet_style"
description: "ImageNet-100 with 224x224 input - ResNet-style blocks only (Basic, SelfGated, FullGated)"

# 数据集配置
dataset:
  name: "imagenet"
  num_classes: 100
  input_size: 224

# 搜索空间配置
search_space:
  # CT相关配置
  ct_slots: 32768           # 每个CT的槽位数 (2^15)
  initial_ct_count: 1       # 初始CT数量
  initial_min_channels: 28  # 初始最少通道数
  initial_max_channels: 96  # 初始最多通道数

  # Stem层配置
  stem:
    enabled: true
    allowed_codes: null     # 允许所有 [0-3]

  # 第二次降分辨率配置
  second_downsample:
    enabled: true
    allowed_codes: null     # 允许所有 [0-5]

  # Block配置 - 只使用ResNet风格
  # Block 16-17: BasicBlock (poly4, swish)
  # Block 18-19: BasicSelfGatedBlock (poly4, lswish)
  # Block 20-21: FullGatedBasicBlock (poly4, lswish)
  blocks:
    allowed_block_ids: [16, 17, 18, 19, 20, 21]
    first_layers_constraints: null

  # Stride配置 - 限制10个blocks
  stride:
    allowed_block_counts: [10]
    num_strides: 3

  # CT策略配置
  ct_policies:
    allowed: ["keep", "half"]

# 输出配置
output:
  base_dir: "generated_networks/imagenet_224_resnet"
  save_format: "json"
