# Accuracy recovery candidate for the evolution rank-10 NAS model.
# Uses the stable head4 partial Poly4 mapping, restores learned activation scale,
# and recovers from collapse by restoring the best checkpoint and reducing LR.

global:
  num_classes: 100
  default_epochs: 12
  default_batch_size: 96
  default_learning_rate: 0.0007
  default_num_workers: 4
  default_save_freq: 0

json_models:
  - name: "evolution-rank10-poly4-head4-learned-recover-imagenet100-224-b96"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_head4.json"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 96
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.35
      poly4_scale_mode: learned
      poly4_degree: 2
      poly4_output_scale: 0.2
      smartpaf_ct_init: true
      smartpaf_ct_batches: 8
      smartpaf_ct_max_samples: 20000
      smartpaf_ct_steps: 300
      smartpaf_ct_lr: 0.01
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 6
      smartpaf_alternate_training: false
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: restore_best_reduce_lr
      collapse_guard_lr_factor: 0.2
