# ImageNet-100 224px fast proxy: baseline vs recommended AutoFHE degree-2.
# This avoids running the PAT ablation first because prior 96px ImageNet100 and
# CIFAR10 224 results both showed PAT stable but weaker than no-PAT.
# Run with:
#   --dataset imagenet100 --input_size 224 --gpus all --no_memory_fs

global:
  num_classes: 100
  default_epochs: 12
  default_batch_size: 128
  default_learning_rate: 0.0007
  default_num_workers: 4
  default_save_freq: 0

models:
  - name: "imagenet100-224-swish-baseline-fast-b128"
    class: "resnet-basic-swish-layer1block1"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 128
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: stop

  - name: "imagenet100-224-autofhe-degree2-fast-b128"
    class: "resnet-basic-stablepoly4-layer1block1"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 128
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.35
      poly4_scale_mode: learned
      poly4_degrees: [2, 2]
      poly4_output_scale: 0.2
      smartpaf_ct_init: true
      smartpaf_ct_batches: 8
      smartpaf_ct_max_samples: 20000
      smartpaf_ct_steps: 300
      smartpaf_ct_lr: 0.01
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 6
      smartpaf_alternate_training: false
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: stop
