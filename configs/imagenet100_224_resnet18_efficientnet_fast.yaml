# ImageNet-100 224px fast baseline: standard torchvision ResNet-18 vs EfficientNet-B0.
# Uses the same short training recipe as the existing 224px proxy runs.

global:
  num_classes: 100
  default_epochs: 12
  default_batch_size: 128
  default_learning_rate: 0.0007
  default_num_workers: 4
  default_save_freq: 0

models:
  - name: "imagenet100-224-resnet18-fast-b128"
    class: "resnet18"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 128
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: stop

  - name: "imagenet100-224-efficientnet-b0-fast-b128"
    class: "efficientnet-b0"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 128
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: stop
