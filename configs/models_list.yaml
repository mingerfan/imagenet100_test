# 模型训练配置列表
# 每个模型可以单独配置训练参数

# 全局设置
global:
  num_classes: 100
  default_epochs: 60
  default_batch_size: 128
  default_learning_rate: 0.001
  default_num_workers: 16

# 需要训练的模型列表
models:
  # ResNet18
  - name: "resnet18"
    class: "resnet18"
    params:
      num_classes: 100
      pretrained: true
    epochs: 60
    batch_size: 128
    learning_rate: 0.001
    num_workers: 16
  
  # ResNet34
  - name: "resnet34"
    class: "resnet34"
    params:
      num_classes: 100
      pretrained: true
    epochs: 60
    batch_size: 64
    learning_rate: 0.001
    num_workers: 16
  
  # ResNet50
  - name: "resnet50"
    class: "resnet50"
    params:
      num_classes: 100
      pretrained: true
    epochs: 60
    batch_size: 64
    learning_rate: 0.001
    num_workers: 16