# 模型模式匹配（正则表达式）
# 匹配的模型将自动使用指定的配置进行训练
model_patterns:
  # 示例1: 匹配所有以 "resnet-" 开头的模型（包括 gate_net.py 中的所有变体）
  - pattern: "^resnet-.*"
    description: "所有 ResNet 变体"
    epochs: 60
    batch_size: 256
    learning_rate: 0.001
    num_workers: 4
    params:
      num_classes: 100
      pretrained: false
  
  # 示例2: 只匹配 basic_self_gated 类型的模型
  # - pattern: "^resnet-basic_self_gated-.*"
  #   description: "Basic Self-Gated 变体"
  #   epochs: 50
