# 模型训练配置列表
# 支持显式指定和正则匹配两种方式

# 全局设置
global:
  num_classes: 100
  default_epochs: 60
  default_batch_size: 128
  default_learning_rate: 0.001
  default_num_workers: 16

# 需要训练的模型列表（显式指定）
# models:
#   # ResNet18
#   - name: "resnet18"
#     class: "resnet18"
#     params:
#       num_classes: 100
#       pretrained: false
#     epochs: 60
