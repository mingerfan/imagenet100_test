# Low-resolution ImageNet-100 proxy with more epochs.
# Run with --dataset imagenet100 --input_size 96.

global:
  num_classes: 100
  default_epochs: 12
  default_batch_size: 128
  default_learning_rate: 0.0007
  default_num_workers: 8
  default_save_freq: 0

models:
  - name: "imagenet100-96-long-pa-only"
    class: "resnet-basic-stablepoly4-layer1block1"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 128
    learning_rate: 0.0007
    num_workers: 8
    use_amp: false
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.25
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 4
      smartpaf_alternate_training: false
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_action: warn

  - name: "imagenet100-96-long-pa-at-cycle1"
    class: "resnet-basic-stablepoly4-layer1block1"
    params:
      num_classes: 100
      pretrained: false
    epochs: 12
    batch_size: 128
    learning_rate: 0.0007
    num_workers: 8
    use_amp: false
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    poly_lr_mult: 1.0
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.25
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 4
      smartpaf_alternate_training: true
      smartpaf_at_cycle_epochs: 1
      smartpaf_freeze_bn_during_poly_phase: true
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_action: warn
