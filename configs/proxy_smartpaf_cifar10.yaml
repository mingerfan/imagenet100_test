# Fast proxy config for testing SmartPAF training techniques on small inputs.
# Generate JSON proxy models first, or use the built-in StablePoly4 smoke model.

global:
  num_classes: 10
  default_epochs: 5
  default_batch_size: 128
  default_learning_rate: 0.001
  default_num_workers: 4
  default_save_freq: 0

models:
  - name: "proxy-cifar10-stablepoly4-built-in"
    class: "resnet-basic-stablepoly4-layer1block1"
    params:
      num_classes: 10
      pretrained: false
    epochs: 5
    batch_size: 128
    learning_rate: 0.001
    num_workers: 4
    use_amp: false
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    scheduler: cosine
    warmup_epochs: 1
    warmup_start_factor: 0.1
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.2
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 1
      smartpaf_alternate_training: true
      smartpaf_at_cycle_epochs: 1
      smartpaf_freeze_bn_during_poly_phase: true
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_action: warn

