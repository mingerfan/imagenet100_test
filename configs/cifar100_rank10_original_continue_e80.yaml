# Continue the rank10 original CIFAR-100 control from its e40 best checkpoint.

global:
  num_classes: 100
  default_epochs: 80
  default_batch_size: 256
  default_learning_rate: 0.0002
  default_num_workers: 4
  default_save_freq: 10

_common: &common
  epochs: 80
  batch_size: 256
  learning_rate: 0.0002
  num_workers: 4
  prefetch_factor: 2
  use_amp: false
  val_force_fp32: true
  save_freq: 10
  optimizer_type: adamw
  weight_decay: 0.0001
  scheduler: none
  grad_clip_max_norm: 1.0
  label_smoothing: 0.05
  resume: true
  resume_mode: best
  resume_optimizer: false
  resume_scheduler: false

_baseline_trainer: &baseline_trainer
  gate_reg_lambda: 0.0
  collapse_guard_enabled: true
  collapse_guard_drop: 15.0
  collapse_guard_patience: 1
  collapse_guard_action: stop

json_models:
  - name: "cifar100-rank10-original-continue-e80-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10.json"
    result_dir: "results/cifar100_rank10_continue_e80/cifar100-rank10-original-continue-e80-b256"
    resume_path: "results/cifar100_rank10_poly_replacement_e40/cifar100-rank10-original-e40-b256/best_model.pth"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer
