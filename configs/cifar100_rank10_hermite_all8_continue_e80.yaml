# Continue HermitePoly4 all8 from its e40 best checkpoint.

global:
  num_classes: 100
  default_epochs: 80
  default_batch_size: 256
  default_learning_rate: 0.0002
  default_num_workers: 4
  default_save_freq: 10

_common: &common
  epochs: 80
  batch_size: 256
  learning_rate: 0.0002
  num_workers: 4
  prefetch_factor: 2
  use_amp: false
  val_force_fp32: true
  save_freq: 10
  optimizer_type: adamw
  weight_decay: 0.0001
  scheduler: none
  grad_clip_max_norm: 1.0
  label_smoothing: 0.05
  resume: true
  resume_mode: best
  resume_optimizer: false
  resume_scheduler: false

_poly_trainer: &poly_trainer
  gate_reg_lambda: 0.0
  poly4_warmup_ratio: 0.125
  poly4_scale_mode: learned
  poly4_degree: 2
  poly4_output_scale: 0.2
  smartpaf_ct_init: true
  smartpaf_ct_batches: 2
  smartpaf_ct_max_samples: 5000
  smartpaf_ct_steps: 80
  smartpaf_ct_lr: 0.01
  smartpaf_progressive: false
  smartpaf_transition_epochs: 6
  smartpaf_alternate_training: false
  collapse_guard_enabled: true
  collapse_guard_drop: 15.0
  collapse_guard_patience: 1
  collapse_guard_action: stop

json_models:
  - name: "cifar100-rank10-hermitepoly4-all8-continue-e80-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_herpn_all8.json"
    result_dir: "results/cifar100_rank10_continue_e80/cifar100-rank10-hermitepoly4-all8-continue-e80-b256"
    resume_path: "results/cifar100_rank10_poly_replacement_e40/cifar100-rank10-hermitepoly4-all8-e40-b256/best_model.pth"
    <<: *common
    poly_weight_decay: 0.0
    poly_scale_lr_mult: 0.1
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *poly_trainer
