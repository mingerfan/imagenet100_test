# More reliable proxy config: CIFAR-100 has the same class count as ImageNet-100.

global:
  num_classes: 100
  default_epochs: 15
  default_batch_size: 128
  default_learning_rate: 0.001
  default_num_workers: 4
  default_save_freq: 5

models:
  - name: "proxy-cifar100-stablepoly4-built-in"
    class: "resnet-basic-stablepoly4-layer1block1"
    params:
      num_classes: 100
      pretrained: false
    epochs: 15
    batch_size: 128
    learning_rate: 0.001
    num_workers: 4
    use_amp: false
    save_freq: 5
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.25
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 1
      smartpaf_alternate_training: true
      smartpaf_at_cycle_epochs: 1
      smartpaf_freeze_bn_during_poly_phase: true
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_action: warn

