# 60-epoch CIFAR-100 long run for Hermite Poly4 replacements and standard baselines.

global:
  num_classes: 100
  default_epochs: 60
  default_batch_size: 256
  default_learning_rate: 0.001
  default_num_workers: 4
  default_save_freq: 0

_common: &common
  epochs: 60
  batch_size: 256
  learning_rate: 0.001
  num_workers: 4
  prefetch_factor: 2
  use_amp: false
  val_force_fp32: true
  save_freq: 0
  optimizer_type: adamw
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 3
  warmup_start_factor: 0.1
  min_lr_ratio: 0.01
  grad_clip_max_norm: 1.0
  label_smoothing: 0.05

_baseline_trainer: &baseline_trainer
  collapse_guard_enabled: true
  collapse_guard_drop: 15.0
  collapse_guard_action: stop

_poly_trainer: &poly_trainer
  gate_reg_lambda: 0.0
  poly4_warmup_ratio: 0.25
  poly4_scale_mode: learned
  poly4_degree: 2
  poly4_output_scale: 0.2
  smartpaf_ct_init: true
  smartpaf_ct_batches: 2
  smartpaf_ct_max_samples: 5000
  smartpaf_ct_steps: 80
  smartpaf_ct_lr: 0.01
  smartpaf_progressive: false
  smartpaf_transition_epochs: 8
  smartpaf_alternate_training: false
  collapse_guard_enabled: true
  collapse_guard_drop: 15.0
  collapse_guard_patience: 1
  collapse_guard_action: stop

_poly_common: &poly_common
  <<: *common
  poly_weight_decay: 0.0
  poly_scale_lr_mult: 0.1
  trainer_kwargs:
    <<: *poly_trainer

models:
  - name: "cifar100-resnet20-e60-b256"
    class: "resnet20"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer

  - name: "cifar100-resnet56-e60-b256"
    class: "resnet56"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer

  - name: "cifar100-resnet110-e60-b256"
    class: "resnet110"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer

  - name: "cifar100-resnet18-e60-b256"
    class: "resnet18"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer

  - name: "cifar100-efficientnet-b0-e60-b256"
    class: "efficientnet-b0"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer

json_models:
  - name: "cifar100-rank10-original-e60-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10.json"
    <<: *common
    params:
      num_classes: 100
      pretrained: false
    trainer_kwargs:
      <<: *baseline_trainer

  - name: "cifar100-rank10-stablepoly4-idx6-e60-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_idx6.json"
    <<: *poly_common
    params:
      num_classes: 100
      pretrained: false

  - name: "cifar100-rank10-hermitepoly4-idx6-e60-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_herpn_idx6.json"
    <<: *poly_common
    params:
      num_classes: 100
      pretrained: false

  - name: "cifar100-rank10-hermitepoly4-idx5-6-7-e60-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_herpn_idx5_6_7.json"
    <<: *poly_common
    params:
      num_classes: 100
      pretrained: false

  - name: "cifar100-rank10-hermitepoly4-all8-e60-b256"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_herpn_all8.json"
    <<: *poly_common
    params:
      num_classes: 100
      pretrained: false
