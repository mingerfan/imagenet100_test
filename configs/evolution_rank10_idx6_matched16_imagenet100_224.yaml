# Matched 16-epoch ImageNet-100 comparison for the evolution-searched rank-10
# NAS model and the current best FHE-friendly single-position idx6 Poly4
# variant. Both models use batch size 96 to isolate the architecture/activation
# difference from the earlier original b128 baseline.

global:
  num_classes: 100
  default_epochs: 16
  default_batch_size: 96
  default_learning_rate: 0.0007
  default_num_workers: 4
  default_save_freq: 0

json_models:
  - name: "evolution-rank10-matched16-imagenet100-224-b96"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10.json"
    params:
      num_classes: 100
      pretrained: false
    epochs: 16
    batch_size: 96
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: stop

  - name: "evolution-rank10-poly4-idx6-matched16-imagenet100-224-b96"
    class: "nas-json"
    json_path: "configs/nas_variants/evolution_rank10_poly4_idx6.json"
    params:
      num_classes: 100
      pretrained: false
    epochs: 16
    batch_size: 96
    learning_rate: 0.0007
    num_workers: 4
    prefetch_factor: 2
    use_amp: false
    val_force_fp32: true
    save_freq: 0
    optimizer_type: adamw
    weight_decay: 0.0001
    poly_weight_decay: 0.0
    poly_scale_lr_mult: 0.1
    scheduler: cosine
    warmup_epochs: 3
    warmup_start_factor: 0.05
    min_lr_ratio: 0.01
    grad_clip_max_norm: 1.0
    label_smoothing: 0.05
    trainer_kwargs:
      gate_reg_lambda: 0.0
      poly4_warmup_ratio: 0.35
      poly4_scale_mode: learned
      poly4_degree: 2
      poly4_output_scale: 0.2
      smartpaf_ct_init: true
      smartpaf_ct_batches: 8
      smartpaf_ct_max_samples: 20000
      smartpaf_ct_steps: 300
      smartpaf_ct_lr: 0.01
      smartpaf_progressive: true
      smartpaf_group_epochs: auto
      smartpaf_transition_epochs: 6
      smartpaf_alternate_training: false
      collapse_guard_enabled: true
      collapse_guard_drop: 10.0
      collapse_guard_patience: 1
      collapse_guard_action: restore_best_reduce_lr
      collapse_guard_lr_factor: 0.2
